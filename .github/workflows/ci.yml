name: CI Smoke Test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r backend/requirements.txt
      - name: Compile check (catches syntax/indent errors)
        run: python -m compileall -q backend/
      - name: Import smoke test (catches NameError/ImportError)
        run: cd backend && python -c "import main"
